<g class="in" style="animation-delay:0.80s"><rect x="385" y="172" width="171" height="62" rx="10" fill="#ffffff" fill-opacity=".04" stroke="#ffffff" stroke-opacity=".1"/><text x="399" y="201" font-size="21" font-weight="800" style="fill:#4dabf7">LLM</text><text x="399" y="222" font-size="11.5" class="muted">agents</text></g>
