<svg xmlns="http://www.w3.org/2000/svg" width="580" height="290" viewBox="0 0 580 290" role="img" aria-label="LinkedIn Simulation: A distributed LinkedIn clone: FastAPI microservices with Kafka-first writes, Redis caching, MySQL + MongoDB, and LLM recruiter and career-coach agents, deployed on AWS ECS.">
<title>LinkedIn Simulation: A distributed LinkedIn clone: FastAPI microservices with Kafka-first writes, Redis caching, MySQL + MongoDB, and LLM recruiter and career-coach agents, deployed on AWS ECS.</title>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#e6edf3}
.mono{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace}
.muted{fill:#9aa7b8}
.in{animation:in .7s cubic-bezier(.2,.7,.2,1) backwards}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.flow{stroke-dasharray:4 10;animation:flow 1.6s linear infinite}
@keyframes flow{to{stroke-dashoffset:-28}}
.pulse{animation:pulse 2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(1.6)}}
@media (prefers-reduced-motion:reduce){.in{animation:none}.flow,.pulse{animation:none}}
</style>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1020"/><stop offset="1" stop-color="#111a2e"/></linearGradient><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#ffffff" stroke-opacity=".035"/></pattern></defs>
<rect width="580" height="290" rx="14" fill="url(#bg)"/><rect width="580" height="290" rx="14" fill="url(#grid)"/><rect x=".5" y=".5" width="579" height="289" rx="14" fill="none" stroke="#ffffff" stroke-opacity=".08"/>
<rect x="24" y="0" width="532" height="4" rx="2" fill="#4dabf7"/>
