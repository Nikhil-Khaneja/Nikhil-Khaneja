<rect x="514" y="22" width="42" height="22" rx="11" fill="none" stroke="#4dabf7"/><text x="522" y="37" font-size="11" font-weight="700" style="fill:#4dabf7">TEAM</text>
</g>
<g class="in" style="animation-delay:0.18s"><text x="24" y="76" font-size="25" font-weight="800">LinkedIn Simulation</text></g>
<g class="in" style="animation-delay:0.20s"><text x="24" y="106" font-size="13.5" class="muted">A distributed LinkedIn clone: FastAPI microservices with</text></g>
<g class="in" style="animation-delay:0.25s"><text x="24" y="126" font-size="13.5" class="muted">Kafka-first writes, Redis caching, MySQL + MongoDB, and LLM</text></g>
<g class="in" style="animation-delay:0.30s"><text x="24" y="146" font-size="13.5" class="muted">recruiter and career-coach agents, deployed on AWS ECS.</text></g>
<g class="in" style="animation-delay:0.60s"><rect x="24" y="172" width="171" height="62" rx="10" fill="#ffffff" fill-opacity=".04" stroke="#ffffff" stroke-opacity=".1"/><text x="38" y="201" font-size="21" font-weight="800" style="fill:#4dabf7">8</text><text x="38" y="222" font-size="11.5" class="muted">microservices</text></g>
