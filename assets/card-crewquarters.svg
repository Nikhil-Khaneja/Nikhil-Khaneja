<svg xmlns="http://www.w3.org/2000/svg" width="580" height="290" viewBox="0 0 580 290" role="img" aria-label="CrewQuarters: Self-hosted AI-agent platform for NVIDIA GB10. Serves open-weight LLMs with vLLM and admits a model only if GPU memory and KV-cache budget allow. Agents run in sandboxed containers.">
<title>CrewQuarters: Self-hosted AI-agent platform for NVIDIA GB10. Serves open-weight LLMs with vLLM and admits a model only if GPU memory and KV-cache budget allow. Agents run in sandboxed containers.</title>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#e6edf3}
.mono{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace}
.muted{fill:#9aa7b8}
.in{animation:in .7s cubic-bezier(.2,.7,.2,1) backwards}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.flow{stroke-dasharray:4 10;animation:flow 1.6s linear infinite}
@keyframes flow{to{stroke-dashoffset:-28}}
.pulse{animation:pulse 2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(1.6)}}
@media (prefers-reduced-motion:reduce){.in{animation:none}.flow,.pulse{animation:none}}
</style>
